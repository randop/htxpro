listen: "0.0.0.0:8443"
plain_listen: "0.0.0.0:8080"
http1_secure_enabled: true
http1_plain_enabled: true
http2_secure_enabled: true
http2_plain_enabled: true
# Each TLS setting accepts either one path (shown) or a YAML list. A single
# PEM file may contain one fullchain or several concatenated fullchains; keys
# may be concatenated or kept in separate files. Leaves are paired with keys
# by public key, and issuer chains are rebuilt from the supplied certificates.
#
# For multiple domains, configure either concatenated files or separate paths:
# tls_cert:
#   - "certs/example.com/fullchain.pem"
#   - "certs/test.com/fullchain.pem"
# tls_key:
#   - "certs/example.com/privkey.pem"
#   - "certs/test.com/privkey.pem"
#
# The TLS SNI name selects the chain: exact DNS SAN names (or the CN when a
# certificate has no DNS SAN) beat wildcards, and a wildcard matches exactly
# one label. The first chain is the fallback for clients that omit SNI or
# request an unknown name.
tls_cert: "certs/fullchain.pem"
tls_key: "certs/privkey.pem"
max_request_body_bytes: 1048576
max_static_file_bytes: 16777216
log_filter: "info,htxpro=debug"
timeouts:
  tls_handshake_ms: 5000
  request_headers_ms: 5000
  request_body_ms: 10000
  request_process_ms: 5000
  response_write_ms: 10000
  keep_alive_idle_ms: 15000
limits:
  max_inflight_requests: 256
  max_inflight_requests_per_ip: 32
  max_inflight_requests_per_host: 128
  max_inflight_static_requests: 16
  max_inflight_controller_requests: 128
  max_concurrent_streams_per_connection: 128
  max_header_bytes: 65536
  max_tcp_connections: 256
  max_tcp_connections_per_ip: 32
  max_quic_connections: 512
  max_quic_connections_per_ip: 64
  max_tracked_client_ips: 65536
rate_limit:
  enabled: true
  global_requests_per_second: 1000
  global_burst: 2000
  requests_per_second_per_ip: 20
  burst_per_ip: 40

# Requests on HTTP/3, HTTP/2, and both HTTP/1.1 listeners 
# are routed by :authority / Host. 
# Exact names are checked before wildcards.
default_host: "example.test"
virtual_hosts:
  - host: "example.test"
    aliases: ["www.example.test"]
    static:
      root: "public"
      index: "index.html"
      spa_fallback: false
      cache_control: "public, max-age=60"

  - host: "*.tenant.example.test"
    static:
      root: "sites/tenant"
      index: "index.html"
      spa_fallback: true
      cache_control: "public, max-age=300"

  - host: "api.example.test"
    controller: "public_api"
    # Uncomment to require authentication through a named security module:
    # security:
    #   module: "workos"

controllers:
  public_api:
    routes:
      - method: "GET"
        path: "/healthz"
        handler: "health"
      - method: "GET"
        path: "/status"
        handler: "status"
      - method: "GET"
        path: "/metrics"
        handler: "metrics"
      - method: "POST"
        path: "/echo"
        handler: "echo"
      - method: "GET"
        path: "/v1/whoami"
        handler: "whoami"
      - method: "GET"
        path: "/v1/items"
        handler: "items"
      - method: "POST"
        path: "/v1/items"
        handler: "items"
      - method: "GET"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "HEAD"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "PUT"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "PATCH"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "DELETE"
        path: "/v1/items/{id}"
        handler: "items"

# Optional host authentication. Named modules may be referenced by any static
# or controller virtual host through:
#
#   security:
#     module: "workos"
#
# Multiple named module instances are supported. This build implements only
# the WorkOS OAuth2 authorization-code module. The callback path below is
# derived from redirect_uri and is handled before static/controller dispatch.
# Register the exact redirect URI in the WorkOS dashboard.
#
# security:
#   cookie_name: "htxpro_session"
#   cookie_secure: true          # set false only for local plain-HTTP testing
#   session_secret: "replace-with-at-least-32-random-bytes"
#   session_ttl_seconds: 3600
#   state_ttl_seconds: 600
#   modules:
#     workos:
#       type: "oauth2_workos"
#       client_id: "client_123456789"
#       client_secret: "sk_example_123456789"
#       redirect_uri: "https://api.example.test/_htxpro/auth/workos/callback"
#       authorization_endpoint: "https://api.workos.com/user_management/authorize"
#       token_endpoint: "https://api.workos.com/user_management/authenticate"
#       provider: "authkit"
#       scopes: ["openid", "profile", "email"]
#       http_timeout_ms: 10000
